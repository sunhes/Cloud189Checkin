name: Cloud check in action

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 01:15 UTC = 09:15 Asia/Shanghai.
    - cron: 15 1 * * *

permissions:
  contents: write

concurrency:
  group: cloud189-checkin
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: user
    timeout-minutes: 15
    steps:
      - name: 🔀 random delay 0-300 seconds
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 301))

      - name: 🔌 Check out code
        uses: actions/checkout@v7

      - name: 🔨 Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: yarn
          cache-dependency-path: yarn.lock
      
      - name: 📹 Restore cached Cookie
        id: cache-cookie-restore
        uses: actions/cache/restore@v6
        with:
          path: .token
          key: cloud189-token-${{ hashFiles('.token/*.json') }}
          restore-keys: cloud189-token-

      - name: 📡 Init dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: 🚀 Run
        env:
          TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
          TY_SSON_COOKIE: ${{ secrets.TY_SSON_COOKIE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          CLOUD189_VERBOSE: ${{ vars.debug }}
        run: |
          if [ -z "${TY_ACCOUNTS:-}" ]; then
            echo "::error::Required secret TY_ACCOUNTS is not configured"
            exit 1
          fi

          for attempt in 1 2 3; do
            if npm start; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 15))
          done

      - name: 🔑 Compute token hash
        if: always()
        run: |
          if ! find .token -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            echo "No token files were created; skipping cache save"
            exit 0
          fi

          NEW_HASH=$(find .token -type f -name '*.json' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "TOKEN_HASH=${NEW_HASH}" >> $GITHUB_ENV

      - name: 📹 Save cached Cookie
        if: always() && env.TOKEN_HASH != ''
        uses: actions/cache/save@v6
        with:
          path: .token
          key: cloud189-token-${{ env.TOKEN_HASH }}

      - name: 🚗 Keep Running
        if: github.event_name == 'schedule' && success()
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git pull --rebase --autostash
          git commit --allow-empty -m "chore: keep scheduled workflow active [skip ci]"
          git push
